[include moonraker/base.conf]

[include moonraker/exclude_object.conf]

[include moonraker/spoolman.conf]

[include moonraker/led_effect.conf]

[include moonraker/tmc_autotune.conf]

[update_manager klipper-backup]
type: git_repo
path: ~/klipper-backup
origin: https://github.com/Staubgeborener/klipper-backup.git
managed_services: moonraker
primary_branch: main

[include octoeverywhere-system.cfg]

[update_manager mobileraker]
install_script: /home/fly/mobileraker_companion/scripts/install.sh
requirements: /home/fly/mobileraker_companion/scripts/mobileraker-requirements.txt
env: /home/fly/mobileraker-env/bin/python
managed_services: mobileraker
primary_branch: main
origin: https://github.com/Clon1998/mobileraker_companion.git
path: /home/fly/mobileraker_companion
type: git_repo
