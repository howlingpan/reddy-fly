[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_address: 43
i2c_mcu: toolhead
i2c_bus: i2c1b
x_offset: 0
y_offset: 21.42
descend_z: 2
i2c_speed: 4000000

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: toolhead:gpio28
calibration_position: 175, 175, 5
extruder_heating_z: 30
calibration_extruder_temp: 170
calibration_bed_temp: 100
max_validation_temp: 120
horizontal_move_z: 4

[quad_gantry_level]
gantry_corners:
    -60,-10
    410,420
points:
    50,25
    50,275
    300,275
    300,25
speed: 350
horizontal_move_z: 2
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[bed_mesh]
speed: 350
horizontal_move_z: 4
mesh_min: 25, 25
mesh_max: 325, 325
probe_count: 9, 9
fade_start: 0.6
fade_end: 10.0
algorithm: bicubic
zero_reference_position: 175, 175
adaptive_margin: 5

[stepper_z]
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0
