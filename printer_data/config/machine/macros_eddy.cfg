# Eddy probe macros — Demon_Eddy + Demon_Klipper_Essentials_Unified homing patterns
# https://github.com/3DPrintDemon/Demon_Eddy
# https://github.com/3DPrintDemon/Demon_Klipper_Essentials_Unified
# Probe section: fly_eddy_probe (machine/probe_eddy.cfg)
# Requires [force_move] in machine/printer.cfg. Do not use [safe_z_home] with this.

[gcode_macro _EDDY_VARS]
variable_homing_zhop: 5
variable_z_park: 15
variable_homing_travel_speed: 350
variable_z_lift_speed: 20
variable_home_x: 175
variable_home_y: 175
variable_old_klipper_version: False
gcode:

[delayed_gcode RESTORE_PROBE_OFFSET]
initial_duration: 1.0
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if not printer["gcode_macro SET_GCODE_OFFSET"].restored %}
        SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=runtime_offset VALUE={svv.nvm_offset|default(0.0)|float}
        SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=backup_offset VALUE={svv.nvm_offset|default(0.0)|float}
        SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=restored VALUE=True
    {% endif %}

[gcode_macro _Z_LIFT]
description: Single pre-home Z lift (DKEU _Z_LIFT pattern)
gcode:
    {% set v = printer["gcode_macro _EDDY_VARS"] %}
    {% set zhop = v.homing_zhop|float|abs %}
    {% set z_speed = v.z_lift_speed|float * 60 %}
    {% if 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
        G90
        G0 Z{zhop} F{z_speed}
        M400
        SET_KINEMATIC_POSITION SET_HOMED= CLEAR_HOMED=Z
    {% elif printer.toolhead.position.z < zhop %}
        G90
        G0 Z{zhop} F{z_speed}
        M400
    {% endif %}

[gcode_macro _Z_PARK]
description: Park at bed center after homing (DKEU eddy z_park)
gcode:
    {% set v = printer["gcode_macro _EDDY_VARS"] %}
    {% set hx = v.home_x|float %}
    {% set hy = v.home_y|float %}
    {% set z_park = v.z_park|float|abs %}
    {% set travel = v.homing_travel_speed|float * 60 %}
    G90
    G0 X{hx} Y{hy} Z{z_park} F{travel}
    M400

[homing_override]
axes: xyz
gcode:
    {% set v = printer["gcode_macro _EDDY_VARS"] %}
    {% set zhop = v.homing_zhop|float|abs %}
    {% set hx = v.home_x|float %}
    {% set hy = v.home_y|float %}
    {% set travel = v.homing_travel_speed|float * 60 %}
    {% set z_speed = v.z_lift_speed|float * 60 %}

    {% set X, Y, Z = False, False, False %}
    {% if params.X is not defined and params.Y is not defined and params.Z is not defined %}
        {% set X, Y, Z = True, True, True %}
    {% else %}
        {% if params.X is defined %}{% set X = True %}{% endif %}
        {% if params.Y is defined %}{% set Y = True %}{% endif %}
        {% if params.Z is defined %}{% set Z = True %}{% endif %}
    {% endif %}

    BED_MESH_CLEAR
    G90

    {% if X or Y or (Z and not ('x' in printer.toolhead.homed_axes and 'y' in printer.toolhead.homed_axes)) %}
        _Z_LIFT
    {% elif Z and 'z' in printer.toolhead.homed_axes and printer.toolhead.position.z < zhop %}
        _Z_LIFT
    {% endif %}

    {% if X %}
        G28 X
    {% endif %}
    {% if Y %}
        G28 Y
    {% endif %}

    {% if Z %}
        {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
            G28 X
            G28 Y
        {% endif %}
        {% if printer.configfile.config.bed_mesh.zero_reference_position is defined %}
            {% set zrp = printer.configfile.config.bed_mesh.zero_reference_position %}
            {% set hx = zrp.split(',')[0]|trim|float %}
            {% set hy = zrp.split(',')[1]|trim|float %}
        {% endif %}
        G0 X{hx} Y{hy} F{travel}
        M400
        G28 Z
        G91
        G0 Z{zhop} F{z_speed}
        G90
        PROBE
        SET_Z_FROM_PROBE
        _Z_PARK
    {% endif %}

[gcode_macro SET_Z_FROM_PROBE]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set backup_rt_offset = printer["gcode_macro SET_GCODE_OFFSET"].backup_offset|float %}
    {% set restored_RTOS = printer["gcode_macro SET_GCODE_OFFSET"].restored %}
    {% if restored_RTOS != True %}
        SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=runtime_offset VALUE={backup_rt_offset}
        SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=restored VALUE=True
    {% endif %}
    _SET_Z_COMMIT

[gcode_macro _SET_Z_COMMIT]
gcode:
    {% set eddy_vars = printer["gcode_macro _EDDY_VARS"] %}
    {% set cf = printer.configfile.settings %}
    {% if eddy_vars.old_klipper_version %}
        {% set last_probe = printer.probe.last_z_result %}
    {% else %}
        {% set last_probe = printer.probe.last_probe_position.z %}
    {% endif %}
    SET_GCODE_OFFSET_ORIG Z={(last_probe - cf['probe_eddy_current fly_eddy_probe'].descend_z + printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset)}

[gcode_macro Z_OFFSET_APPLY_PROBE]
rename_existing: Z_OFFSET_APPLY_PROBE_ORIG
gcode:
    SAVE_VARIABLE VARIABLE=nvm_offset VALUE={printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset}

[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_ORIG
variable_restored: False
variable_backup_offset: 0.0
variable_runtime_offset: 0.0
gcode:
    {% if params.Z_ADJUST %}
        SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=runtime_offset VALUE={(printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset + params.Z_ADJUST|float)}
    {% endif %}
    {% if params.Z %}
        {% set paramList = rawparams.split() %}
        {% for i in range(paramList|length) %}
            {% if paramList[i]=="Z=0" %}
                {% set temp=paramList.pop(i) %}
                {% set temp="Z_ADJUST=" + (-printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset)|string %}
                {% if paramList.append(temp) %}{% endif %}
            {% endif %}
        {% endfor %}
        {% set rawparams=paramList|join(' ') %}
        SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=runtime_offset VALUE=0.0
        SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=restored VALUE=False
    {% endif %}
    SET_GCODE_OFFSET_ORIG {rawparams}

[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
    BED_MESH_CLEAR
    G28 X Y
    M104 S0
    M140 S0
    M106 S0
    G90
    G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} F6000
    {% if 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z={printer.toolhead.axis_maximum.z - 1}
    {% endif %}
    PROBE_EDDY_CURRENT_CALIBRATE {rawparams}

[gcode_macro EDDY_LDC_CALIBRATE_DRIVE_CURRENT]
description: Calibrate LDC drive current for fly_eddy_probe
gcode:
    BED_MESH_CLEAR
    SET_KINEMATIC_POSITION X=100 Y=100 Z=10
    G28 X Y
    M104 S0
    M140 S0
    M106 S0
    G0 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} F6000
    G0 Z30 F600
    G4 P1000
    LDC_CALIBRATE_DRIVE_CURRENT CHIP=fly_eddy_probe
    G4 P1000
    SAVE_CONFIG

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    {% set descend_z = printer.configfile.settings['probe_eddy_current fly_eddy_probe'].descend_z|float %}
    SAVE_GCODE_STATE NAME=STATE_QGL
    BED_MESH_CLEAR
    {% if not printer.quad_gantry_level.applied %}
        _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=10 RETRY_TOLERANCE=1
    {% endif %}
    _QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z={descend_z} RETRY_TOLERANCE=0.075 RETRIES=20 METHOD=rapid_scan ADAPTIVE=1
    G90
    G0 Z10 F6000
    RESTORE_GCODE_STATE NAME=STATE_QGL
    M400

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:
    {% set descend_z = printer.configfile.settings['probe_eddy_current fly_eddy_probe'].descend_z|float %}
    {% set target_temp = printer.heater_bed.target %}
    M140 S0
    _BED_MESH_CALIBRATE HORIZONTAL_MOVE_Z={descend_z} METHOD=rapid_scan {rawparams}
    M140 S{target_temp}
